# Project Hub — blocchi di sicurezza a livello Apache.
#
# In produzione il document root contiene solo index.php e assets/, ma in
# sviluppo docker-compose.override.yml monta l'intera repository: queste
# regole negano l'accesso web a tutto ciò che non deve essere servito.

# Directory e file nascosti (.git, .env, .claude, .gitkeep, ...).
<DirectoryMatch "/var/www/html/\.">
    Require all denied
</DirectoryMatch>

# Dati interni: SQLite, backup, git-service, test e documentazione.
<Directory /var/www/html/data>
    Require all denied
</Directory>
<Directory /var/www/html/tests>
    Require all denied
</Directory>
<Directory /var/www/html/docs>
    Require all denied
</Directory>
<Directory /var/www/html/docker>
    Require all denied
</Directory>
<Directory /var/www/html/git-service>
    Require all denied
</Directory>

<Directory "/var/www/html">
    # File nascosti nel nome (.env, .gitignore, .gitkeep, ...).
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
    # File con estensione che non viene mai servita dal frontend.
    <FilesMatch "(?i)\.(sqlite|sqlite3|db|env|md|markdown|py|pyc|sh|bash|zsh|yml|yaml|ini|conf|config|lock|dist|example|log|sql|bak|swp|swo|tmp|tar|gz|tgz|bz2|xz|zip|rar|7z|json|xml|csv|tsv|po|pot|mo|map|scss|sass|less|ts|tsx|jsx|vue|wasm|crt|pem|key|p12|pfx|der|ovpn|kdbx|htpasswd)$">
        Require all denied
    </FilesMatch>
    # File di configurazione/build senza estensione.
    <FilesMatch "(?i)^(dockerfile|docker-compose.*|makefile|gemfile|rakefile|procfile|vagrantfile|brewfile|justfile|taskfile.*|\.htaccess|\.htpasswd|id_rsa.*|authorized_keys.*)$">
        Require all denied
    </FilesMatch>
</Directory>
